services:
  - type: web
    name: dignitas-adaptive-auth
    env: python
    buildCommand: pip install -r requirements.txt || pip install -r backend/requirements.txt
    startCommand: python -c "import os; os.chdir('backend') if os.path.isdir('backend') else None; import uvicorn; uvicorn.run('main:app', host='0.0.0.0', port=int(os.getenv('PORT', 8000)))"
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
